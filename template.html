<title>2026 모의고사 자료실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 학년 탭 → 시험(월) 띠 → 교시 순서대로 과목 줄. 수능 OMR 답안지의 붉은 선과 칸을 모티프로. */
:root {
  --bg: #fbf9f9;
  --surface: #ffffff;
  --fg: #231c1e;
  --muted: #6f6266;
  --line: #e7dcdf;
  --omr: #c2263e;          /* OMR 카드의 붉은 인쇄색 */
  --omr-soft: #fbe9ec;
  --ink: #2a4a8c;          /* 컴퓨터용 사인펜 느낌의 보조색 (해설) */
  --ink-soft: #e8eef9;
  --ok: #1f7a4d;
  --ok-soft: #e4f4ea;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171314; --surface: #211b1d; --fg: #f1eaec; --muted: #a8999e; --line: #3a3034;
    --omr: #f0697c; --omr-soft: #3a1f25; --ink: #8fb0f0; --ink-soft: #1f2a40; --ok: #6fd19c; --ok-soft: #173327;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171314; --surface: #211b1d; --fg: #f1eaec; --muted: #a8999e; --line: #3a3034;
  --omr: #f0697c; --omr-soft: #3a1f25; --ink: #8fb0f0; --ink-soft: #1f2a40; --ok: #6fd19c; --ok-soft: #173327;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.wrap > * { min-width: 0; }
header { display: grid; gap: 6px; border-bottom: 2px solid var(--omr); padding-bottom: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--omr); font-weight: 700; }
h1 { margin: 0; font-size: clamp(24px, 4vw, 32px); line-height: 1.2; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

.controls { display: grid; gap: 14px; }
.grades { display: flex; gap: 8px; flex-wrap: wrap; }
.grade {
  font: inherit; font-weight: 700; font-size: 16px; padding: 8px 20px; border-radius: 4px; cursor: pointer;
  border: 1.5px solid var(--omr); background: var(--surface); color: var(--omr);
}
.grade[aria-pressed="true"] { background: var(--omr); color: var(--surface); }
.exams { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.exam {
  font: inherit; text-align: left; cursor: pointer; padding: 10px 12px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; gap: 2px;
}
.exam .mon { font-weight: 700; font-size: 17px; }
.exam .date { font-family: var(--font-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.exam .org { font-size: 12px; color: var(--muted); }
.exam .org.kice { color: var(--omr); font-weight: 500; }
.exam[aria-pressed="true"] { border-color: var(--omr); box-shadow: inset 0 0 0 1px var(--omr); background: var(--omr-soft); }
.exam:focus-visible, .grade:focus-visible, .btn:focus-visible, #q:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.sum { margin: 0; font-weight: 700; font-size: 18px; }
.sum small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 6px; }
#q {
  font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
  color: var(--fg); width: min(260px, 100%);
}

.period { display: grid; grid-template-columns: 88px 1fr; border-top: 1px solid var(--line); }
.period > .plabel { padding: 14px 0; display: grid; align-content: start; gap: 2px; }
.plabel b { font-family: var(--font-num); color: var(--omr); font-size: 13px; letter-spacing: .04em; }
.plabel span { font-weight: 700; }
.rows { display: grid; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .name { font-weight: 500; min-width: 0; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 3px; font-size: 13px; font-weight: 500;
  text-decoration: none; border: 1px solid transparent; white-space: nowrap;
}
.btn.q { background: var(--omr-soft); color: var(--omr); border-color: color-mix(in srgb, var(--omr) 30%, transparent); }
.btn.a { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.btn.e { background: var(--ink-soft); color: var(--ink); border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
.btn.x { background: transparent; color: var(--muted); border-color: var(--line); }
.btn:hover { filter: brightness(.96); text-decoration: underline; }
.empty { color: var(--muted); padding: 20px 0; }

footer { border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
footer a { color: var(--ink); }
@media (max-width: 560px) {
  .period { grid-template-columns: 1fr; }
  .period > .plabel { padding: 12px 0 0; grid-auto-flow: column; justify-content: start; gap: 8px; align-items: baseline; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .exam, .grade { transition: background-color .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">2026학년도 · 전국연합학력평가 · 수능 모의평가</div>
    <h1>2026 모의고사 자료실</h1>
    <p class="lede">학년과 시험을 고르면 과목별 문제지·정답·해설을 바로 열 수 있습니다. 영어는 듣기 음성과 대본도 있습니다.</p>
  </header>

  <section class="controls" aria-label="시험 선택">
    <div class="grades" role="group" aria-label="학년" id="grades"></div>
    <div class="exams" role="group" aria-label="시험" id="exams"></div>
  </section>

  <section aria-live="polite">
    <div class="toolbar">
      <p class="sum" id="sum"></p>
      <input id="q" type="search" placeholder="과목 찾기 (예: 미적분, 생명)" aria-label="과목 찾기">
    </div>
    <div id="list"></div>
  </section>

  <footer>
    <div>파일은 EBSi(한국교육방송공사)가 공개한 원본으로 연결되며, 저작권은 각 출제 기관(시·도교육청, 한국교육과정평가원)에 있습니다.</div>
    <div>자료 기준일 <span id="asof"></span> · 원본 목록: <a href="https://www.ebsi.co.kr/ebs/xip/xipc/previousPaperList.ebs?targetCd=D300" target="_blank" rel="noopener">EBSi 기출문제</a>, <a href="https://www.suneung.re.kr/" target="_blank" rel="noopener">한국교육과정평가원</a></div>
  </footer>
</div>

<script>
const ASOF = "2026-10-30";
const BASE = "https://wdown.ebsi.co.kr/W61001/01exam";
const RAW = __DATA__;

// 교시 구성 (수능·학평 공통 순서)
const PERIODS = [
  { n: 1, label: "국어", areas: ["국어"] },
  { n: 2, label: "수학", areas: ["수학"] },
  { n: 3, label: "영어", areas: ["영어"] },
  { n: 4, label: "한국사·탐구", areas: ["한국사", "사탐", "과탐", "직탐"] },
  { n: 5, label: "제2외국어/한문", areas: ["제2외국어"] },
];
const AREA_ORDER = ["국어", "수학", "영어", "한국사", "사탐", "과탐", "직탐", "제2외국어"];
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];

const rows = RAW.map(r => {
  const parts = r.t.split(" ");            // "고3 6월 모평(평가원) 화법과 작문"
  const kind = parts[2];                   // 학평(서울) | 모평(평가원)
  return { ...r, date: r.q.slice(1, 9), kind, name: parts.slice(3).join(" ") };
});

const exams = {};                          // grade -> [{m, date, kind}]
rows.forEach(r => {
  const list = exams[r.g] ||= [];
  if (!list.find(e => e.m === r.m)) list.push({ m: r.m, date: r.date, kind: r.kind });
});
Object.values(exams).forEach(l => l.sort((a, b) => a.m - b.m));

let state = { g: 3, m: null, q: "" };
try { const s = JSON.parse(localStorage.getItem("mock2026") || "null"); if (s && exams[s.g]) state.g = s.g, state.m = s.m; } catch (e) {}
if (!state.m || !exams[state.g].some(e => e.m === state.m)) state.m = exams[state.g].at(-1).m;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmtDate(d) {
  const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  return `${+d.slice(4, 6)}.${+d.slice(6, 8)} (${DAYS[dt.getDay()]})`;
}
function orgLabel(kind) {
  const m = kind.match(/^(학평|모평)\((.+)\)$/);
  if (!m) return kind;
  return m[1] === "모평" ? "평가원 모의평가" : `학력평가 · ${m[2]}교육청`;
}
function save() { try { localStorage.setItem("mock2026", JSON.stringify({ g: state.g, m: state.m })); } catch (e) {} }

function renderGrades() {
  $("grades").innerHTML = [1, 2, 3].map(g =>
    `<button class="grade" type="button" id="grade-${g}" data-g="${g}" aria-pressed="${g === state.g}">고${g}</button>`).join("");
}
function renderExams() {
  $("exams").innerHTML = exams[state.g].map(e =>
    `<button class="exam" type="button" id="exam-${e.m}" data-m="${e.m}" aria-pressed="${e.m === state.m}">
      <span class="mon">${e.m}월</span>
      <span class="date">${fmtDate(e.date)}</span>
      <span class="org ${e.kind.startsWith("모평") ? "kice" : ""}">${esc(orgLabel(e.kind))}</span>
    </button>`).join("");
}
function link(cls, label, path) {
  return path ? `<a class="btn ${cls}" href="${BASE}${esc(path)}" target="_blank" rel="noopener">${label}</a>` : "";
}
function renderList() {
  const exam = exams[state.g].find(e => e.m === state.m);
  const q = state.q.trim().replace(/\s/g, "");
  const items = rows.filter(r => r.g === state.g && r.m === state.m)
    .sort((a, b) => AREA_ORDER.indexOf(a.area) - AREA_ORDER.indexOf(b.area));
  const shown = q ? items.filter(r => (r.name + r.area).replace(/\s/g, "").includes(q)) : items;
  $("sum").innerHTML = `고${state.g} ${state.m}월 ${exam.kind.startsWith("모평") ? "모의평가" : "학력평가"}<small>${fmtDate(exam.date)} · ${items.length}과목</small>`;
  const html = PERIODS.map(p => {
    const rs = shown.filter(r => p.areas.includes(r.area));
    if (!rs.length) return "";
    return `<div class="period"><div class="plabel"><b>${p.n}교시</b><span>${p.label}</span></div><div class="rows">${
      rs.map(r => `<div class="row"><span class="name">${esc(r.name)}</span><span class="btns">${
        link("q", "문제", r.q) + link("a", "정답", r.a) + link("e", "해설", r.e) + link("x", "듣기", r.l) + link("x", "대본", r.s)
      }</span></div>`).join("")}</div></div>`;
  }).join("");
  $("list").innerHTML = html || `<p class="empty">‘${esc(state.q)}’에 맞는 과목이 없습니다. 검색어를 지우면 전체 과목이 보입니다.</p>`;
}
function renderAll() { renderGrades(); renderExams(); renderList(); }

$("grades").addEventListener("click", e => {
  const b = e.target.closest("[data-g]"); if (!b) return;
  state.g = +b.dataset.g;
  if (!exams[state.g].some(x => x.m === state.m)) state.m = exams[state.g].at(-1).m;
  save(); renderAll();
});
$("exams").addEventListener("click", e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  state.m = +b.dataset.m; save(); renderExams(); renderList();
});
$("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
$("asof").textContent = ASOF;
renderAll();
</script>
